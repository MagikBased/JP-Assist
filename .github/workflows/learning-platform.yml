name: learning-platform

on:
  push:
    paths:
      - ".github/workflows/learning-platform.yml"
      - ".gitleaksignore"
      - "apps/learning-platform/**"
      - "CMakeLists.txt"
      - "packages/**"
      - "tests/study-core/**"
      - "games/ocarina-of-time/adapters/**"
      - "games/ocarina-of-time/tools/**"
      - "docs/LEARNING_PLATFORM_*.md"
      - "docs/LEARNING_SITE_ROADMAP.md"
      - "docs/SECURITY_AND_PRIVACY.md"
      - "docs/ANKI_INTEROPERABILITY.md"
      - "docs/releases/**"
  pull_request:
    paths:
      - ".github/workflows/learning-platform.yml"
      - ".gitleaksignore"
      - "apps/learning-platform/**"
      - "CMakeLists.txt"
      - "packages/**"
      - "tests/study-core/**"
      - "games/ocarina-of-time/adapters/**"
      - "games/ocarina-of-time/tools/**"
      - "docs/LEARNING_PLATFORM_*.md"
      - "docs/LEARNING_SITE_ROADMAP.md"
      - "docs/SECURITY_AND_PRIVACY.md"
      - "docs/ANKI_INTEROPERABILITY.md"
      - "docs/releases/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure portable SDK, core, and plugin
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Build portable tests and Shipwright plugin package
        run: cmake --build build --target jp_assist_study_core_tests jpassist_plugin_package --parallel 2

      - name: Run portable tests
        run: ctest --test-dir build --output-on-failure

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          python3 -m venv venv/learning-platform
          venv/learning-platform/bin/pip install -r apps/learning-platform/requirements.txt genanki

      - name: Install browser-test dependencies
        working-directory: apps/learning-platform
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox

      - name: Run service and API tests
        run: |
          PYTHONPATH=apps/learning-platform \
            venv/learning-platform/bin/python -m unittest discover \
            -s apps/learning-platform/tests -v

      - name: Run Chromium browser acceptance
        working-directory: apps/learning-platform
        run: npm run test:browser

      - name: Run Firefox browser acceptance
        working-directory: apps/learning-platform
        run: JP_ASSIST_TEST_BROWSER=firefox npm run test:browser

      - name: Run cross-component Anki acceptance
        run: >-
          venv/learning-platform/bin/python
          games/ocarina-of-time/tools/run_mvp_acceptance.py

      - name: Qualify load and migration operations
        run: apps/learning-platform/scripts/qualify_operations.sh

      - name: Audit Python dependencies and write component SBOM
        run: |
          venv/learning-platform/bin/pip install pip-audit==2.10.1
          mkdir -p apps/learning-platform/var/security
          venv/learning-platform/bin/pip-audit \
            --requirement apps/learning-platform/requirements.txt \
            --format cyclonedx-json \
            --output apps/learning-platform/var/security/python.cdx.json

      - name: Audit browser-test dependencies
        working-directory: apps/learning-platform
        run: npm audit --audit-level=high

      - name: Scan repository history for secrets
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts="--all"

      - name: Build production image
        run: >-
          docker build
          --file apps/learning-platform/Dockerfile
          --tag jp-assist-learning-platform:test
          .

      - name: Verify production release image
        run: apps/learning-platform/scripts/verify_release_image.sh jp-assist-learning-platform:test

      - name: Rehearse clean production-shaped staging
        run: apps/learning-platform/scripts/rehearse_staging.sh

      - name: Generate release-image SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: jp-assist-learning-platform:test
          artifact-name: jp-assist-learning-platform.spdx.json
          output-file: apps/learning-platform/var/security/image.spdx.json
          format: spdx-json
          upload-release-assets: false
          upload-artifact-retention: 14

      - name: Scan release-image SBOM
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/grype.tar.gz \
            https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_amd64.tar.gz
          echo "3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b  /tmp/grype.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/grype.tar.gz --directory /tmp grype
          /tmp/grype \
            sbom:apps/learning-platform/var/security/image.spdx.json \
            --vex apps/learning-platform/security/openvex.json \
            --fail-on high \
            --output json=apps/learning-platform/var/security/image-vulnerabilities.json \
            --output table

      - name: Upload security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: learning-platform-security-evidence
          path: |
            apps/learning-platform/var/security/python.cdx.json
            apps/learning-platform/var/security/image.spdx.json
            apps/learning-platform/var/security/image-vulnerabilities.json
            apps/learning-platform/var/qualification/load.json
            apps/learning-platform/var/qualification/migration.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: learning-platform-browser-failures
          path: |
            apps/learning-platform/var/playwright-results
            apps/learning-platform/var/playwright-report
          if-no-files-found: ignore
          retention-days: 7
